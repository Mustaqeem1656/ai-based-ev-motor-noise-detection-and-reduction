[platformio]
default_envs = selftest
src_dir = src

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
build_flags = -DBOARD_HAS_PSRAM
monitor_speed = 921600
lib_deps =
    adafruit/Adafruit ADXL345 @ ^1.3.4
    adafruit/Adafruit Unified Sensor @ ^1.7.0
    milesburton/DallasTemperature @ ^3.16.0
    paulstoffregen/OneWire @ ^2.3.0
    bblanchon/ArduinoJson @ ^7.2.0
    kosme/arduinoFFT @ ^2.0.2

[env:selftest]
build_src_filter =
    +<selftest/*.cpp>
    +<common/*.cpp>
    +<common/*.h>

[env:main]
build_src_filter =
    +<main/*.cpp>
    +<common/*.cpp>
    +<common/*.h>
